<script>
async function forwardFirebaseUrl(firebaseUrl) {
  const response = await fetch(
    "https://sopna-32z2.onrender.com/api/firebase/forward",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        firebaseUrl: firebaseUrl
      })
    }
  );

  const result = await response.json();
  console.log(result);
}
</script>
